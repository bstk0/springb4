<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title> Person Management System </title>
</head>
<a href="/">Voltar Inicio</a>
<body>
<h2> Person Information </h2>
<form action="#" th:action="@{/prestadorList}" th:object="${prestador}"  method="post">
    <label for="name">Name: </label>
    <input type="text" id="nome" required="required" th:field="*{nome}" />
    <br />
    <label for="age">Age: </label>
    <input type="number" id="observacao" required="required" th:field="*{observacao}"/>
    <br />
    <input type="submit" value="Add person" />
</form>
<br />
<h2> Current persons </h2>
<table>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Age</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    <tr th:each="prestador : ${prestadorList}">
        <td th:text="${prestador.id}"></td>
        <td th:text="${prestador.nome}"></td>
        <td th:text="${prestador.observacao}"></td>
        <td>
            <a th:href="@{/prestador/{id}/edit(id=${prestador.id})}">Edit</a>
        </td>
        <td>
            <form action="#" th:action="@{/prestador/{id}(id=${prestador.id})}" th:method="delete">
<!--                <input type="hidden" name="_method" value="delete" />-->
                <input type="submit" value="Delete" />
            </form>
        </td>
    </tr>
</table>
